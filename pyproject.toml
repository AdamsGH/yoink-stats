[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoink-stats"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "yoink-core>=0.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
yoink-stats = "yoink_stats.standalone:main"
yoink-stats-import = "yoink_stats.importer.json_dump:main"

[project.entry-points."yoink.plugins"]
stats = "yoink_stats:StatsPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
# Plugins live in a monorepo: the real interpreter + deps are at the repo root,
# and cross-plugin/core imports resolve via explicit search paths.
python-interpreter-path = "../../.venv/bin/python"
search-path = [
    "src",
    "../../src",
    "../yoink-insight/src",
    "../yoink-dl/src",
    "../yoink-music/src",
]
